steps:
  # Decrypt the SSH key.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      [
        "gcloud",
        "kms",
        "decrypt",
        "--ciphertext-file=deploy_key.enc",
        "--plaintext-file=/root/.ssh/id_rsa",
        "--location=global",
        "--keyring=${_KEY_RING}",
        "--key=${_KEY_NAME}",
      ]

  # Decrypt the Twitter credentials.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      [
        "gcloud",
        "kms",
        "decrypt",
        "--ciphertext-file=twitter.json.enc",
        "--plaintext-file=twitter.json",
        "--location=global",
        "--keyring=${_KEY_RING}",
        "--key=${_KEY_NAME}",
      ]

  # Decrypt the npm credentials.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      [
        "gcloud",
        "kms",
        "decrypt",
        "--ciphertext-file=npmrc.enc",
        "--plaintext-file=npmrc",
        "--location=global",
        "--keyring=${_KEY_RING}",
        "--key=${_KEY_NAME}",
      ]

  # Decrypt the hub (GitHub) credentials.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      [
        "gcloud",
        "kms",
        "decrypt",
        "--ciphertext-file=hub.enc",
        "--plaintext-file=hub",
        "--location=global",
        "--keyring=${_KEY_RING}",
        "--key=${_KEY_NAME}",
      ]

  # Set up git with key and domain.
  - name: "gcr.io/cloud-builders/git"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        chmod 600 /root/.ssh/id_rsa
        cat <<EOF >/root/.ssh/config
        Hostname github.com
        IdentityFile /root/.ssh/id_rsa
        EOF
        ssh-keyscan github.com >> /root/.ssh/known_hosts

  # Clone the repository.
  - name: "gcr.io/cloud-builders/git"
    args: ["clone", "git@github.com:${_REPOSITORY_ORG}/${_REPOSITORY_NAME}"]

  # Set up the Git configuration.
  - name: "gcr.io/cloud-builders/git"
    dir: "${_REPOSITORY_NAME}"
    args: ["config", "--global", "user.email", "firebase-oss-bot@google.com"]
  - name: "gcr.io/cloud-builders/git"
    dir: "${_REPOSITORY_NAME}"
    args: ["config", "--global", "user.name", "Google Open Source Bot"]

  # Set up the Twitter credentials.
  - name: "gcr.io/$PROJECT_ID/package-builder"
    entrypoint: "cp"
    args: ["-v", "twitter.json", "${_REPOSITORY_NAME}/scripts/twitter.json"]

  # Set up the npm credentials.
  - name: "gcr.io/$PROJECT_ID/package-builder"
    entrypoint: "bash"
    args: ["-c", "cp -v npmrc ~/.npmrc"]

  # Set up the hub credentials for package-builder.
  - name: "gcr.io/$PROJECT_ID/package-builder"
    entrypoint: "bash"
    args: ["-c", "mkdir -vp ~/.config && cp -v hub ~/.config/hub"]

  # Publish the package.
  - name: "gcr.io/$PROJECT_ID/package-builder"
    dir: "${_REPOSITORY_NAME}"
    entrypoint: bash
    args:
      - -c
      - |
        if [ "${_VERSION}" == "preview" ]; then
          ./scripts/publish.sh "${_VERSION}" "${_BRANCH}"
        else
          GITHUB_TOKEN=$(cat ~/.config/hub) ./scripts/publish.sh "${_VERSION}"
        fi
    env:
      - "REPOSITORY_ORG=${_REPOSITORY_ORG}"
      - "REPOSITORY_NAME=${_REPOSITORY_NAME}"

  # Wait for package to be available on npm.
  - name: "gcr.io/$PROJECT_ID/package-builder"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "Waiting for firebase-tools@$(cat /workspace/version_number.txt) to be available on npm..."
        timeout=1800
        elapsed=0
        interval=15
        until npm install --dry-run "firebase-tools@$(cat /workspace/version_number.txt)" > /dev/null 2>&1; do
          if [ $$elapsed -ge $$timeout ]; then
            echo "Timeout waiting for package after $${elapsed}s."
            exit 1
          fi
          echo "Still waiting... ($${elapsed}s/$${timeout}s)"
          sleep $$interval
          elapsed=$$((elapsed + interval))
        done
        echo "Sleeping for 60 seconds to ensure propagation..." 
        sleep 60
        echo "Package firebase-tools@$(cat /workspace/version_number.txt) is now available on npm."

  # Set up the hub and npm credentials for firepit-builder.
  - name: "gcr.io/$PROJECT_ID/firepit-builder"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ "${_VERSION}" != "preview" ]; then
          mkdir -vp ~/.config && cp -v hub ~/.config/hub
          cp -v npmrc ~/.npmrc
        else
          echo "Skipping credentials for firepit-builder for preview."
        fi

  # Publish the firepit builds, create draft release with artifacts, validate, publish, and move latest tag.
  - name: "gcr.io/$PROJECT_ID/firepit-builder"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ "${_VERSION}" != "preview" ]; then
          cp -v ${_REPOSITORY_NAME}/scripts/firepit-builder/pipeline.js /usr/src/app/pipeline.js
          GITHUB_TOKEN=$(cat ~/.config/hub) GITHUB_REPOSITORY="${_REPOSITORY_ORG}/${_REPOSITORY_NAME}" REPOSITORY_ORG="${_REPOSITORY_ORG}" REPOSITORY_NAME="${_REPOSITORY_NAME}" node /usr/src/app/pipeline.js --package=firebase-tools@$(cat /workspace/version_number.txt) --publish
        else
          echo "Skipping firepit build for preview version."
        fi

  # Verify npm latest tag is pointing to the new version (never moving it backwards).
  - name: "gcr.io/$PROJECT_ID/package-builder"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ "${_VERSION}" != "preview" ]; then
          set -e
          VERSION_NUM="$(cat /workspace/version_number.txt)"
          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+$$'
          echo "Verifying npm latest tag for firebase-tools..."
          LATEST_TAG=""
          for attempt in 1 2 3 4 5; do
            LATEST_TAG=$$(npm view firebase-tools dist-tags.latest --registry https://wombat-dressing-room.appspot.com 2>/dev/null || true)
            if [[ "$${LATEST_TAG}" =~ $${SEMVER_RE} ]]; then
              break
            fi
            sleep 5
          done
          echo "Current npm latest tag: $${LATEST_TAG}"
          if ! [[ "$${VERSION_NUM}" =~ $${SEMVER_RE} && "$${LATEST_TAG}" =~ $${SEMVER_RE} ]]; then
            echo "Error: can't compare version '$${VERSION_NUM}' with npm latest '$${LATEST_TAG}'." >&2
            exit 1
          fi
          IFS=. read -r new_major new_minor new_patch <<< "$${VERSION_NUM}"
          IFS=. read -r cur_major cur_minor cur_patch <<< "$${LATEST_TAG}"
          if (( new_major < cur_major || (new_major == cur_major && (new_minor < cur_minor || (new_minor == cur_minor && new_patch < cur_patch))) )); then
            echo "WARNING: Not moving npm latest tag: $${VERSION_NUM} is older than the current latest ($${LATEST_TAG})."
            exit 0
          fi
          if [ "$${LATEST_TAG}" != "$${VERSION_NUM}" ]; then
            echo "Updating npm latest tag to $${VERSION_NUM}..."
            npm dist-tag add "firebase-tools@$${VERSION_NUM}" latest --registry https://wombat-dressing-room.appspot.com
          fi
          echo "Verified npm latest tag is pointing to $${VERSION_NUM}."

          # The Docker image build below runs `npm update` against the "latest" tag, which only
          # moved a moment ago, so wait for the public registry to serve the new tag.
          timeout=900
          elapsed=0
          interval=15
          until [ "$$(npm view firebase-tools dist-tags.latest --registry https://registry.npmjs.org --prefer-online 2>/dev/null)" = "$${VERSION_NUM}" ]; do
            if [ $$elapsed -ge $$timeout ]; then
              echo "Timeout after $${elapsed}s waiting for registry.npmjs.org to report latest=$${VERSION_NUM}."
              exit 1
            fi
            echo "Waiting for registry.npmjs.org to report latest=$${VERSION_NUM}... ($${elapsed}s/$${timeout}s)"
            sleep $$interval
            elapsed=$$((elapsed + interval))
          done
          echo "registry.npmjs.org reports latest=$${VERSION_NUM}."
        else
          echo "Skipping npm latest tag check for preview version."
        fi

  # Tag the previous version of the docker image
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ "${_VERSION}" != "preview" ]; then
          IMAGE_NAME="us-docker.pkg.dev/${_ARTIFACT_REGISTRY_PROJECT}/us/firebase"
          TAGS=$(gcloud container images list-tags $${IMAGE_NAME} --filter="tags:latest" --format="value(tags)")
          echo "Tags for latest: $${TAGS}"
          PREVIOUS_VERSION=$(echo $${TAGS} | tr ',' '\n' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$$' | head -n 1)
          echo "Detected previous version: $${PREVIOUS_VERSION}"
          if [ -n "$${PREVIOUS_VERSION}" ]; then
            gcloud container images add-tag $${IMAGE_NAME}:latest $${IMAGE_NAME}:no-new-use-public-image-$${PREVIOUS_VERSION} --quiet
          else
            echo "Could not detect previous version tag. Skipping tagging."
          fi
        else
          echo "Skipping for preview version."
        fi

  # Build and publish the Firebase docker image to staging
  - id: "docker-build-push-staging"
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        VERSION_NUM="$$(cat /workspace/version_number.txt)"
        STAGING_REPO="us-docker.pkg.dev/${_ARTIFACT_REGISTRY_PROJECT}/staging/firebase"
        if [ "${_VERSION}" = "preview" ]; then
          RANDOM_HASH="$$(LC_ALL=C tr -dc 'a-f0-9' < /dev/urandom | head -c 16)"
          EXTRA_TAG="no-new-use-public-image-$${RANDOM_HASH}"
        else
          EXTRA_TAG="public-image-$${VERSION_NUM}"
        fi
        echo "Building Docker image for version $${VERSION_NUM}..."
        docker build \
          -t "$${STAGING_REPO}:$${VERSION_NUM}" \
          -t "$${STAGING_REPO}:$${EXTRA_TAG}" \
          -t "$${STAGING_REPO}:$BUILD_ID" \
          -f ./firebase-docker-image/Dockerfile ./firebase-docker-image
        echo "Pushing Docker image to staging repository..."
        docker push "$${STAGING_REPO}:$${VERSION_NUM}"
        docker push "$${STAGING_REPO}:$${EXTRA_TAG}"
        if [ "${_VERSION}" != "preview" ]; then
          docker tag "$${STAGING_REPO}:$${VERSION_NUM}" "$${STAGING_REPO}:latest"
          docker push "$${STAGING_REPO}:latest"
        else
          echo "Preview build: leaving the staging 'latest' tag untouched."
        fi

images:
  - "us-docker.pkg.dev/${_ARTIFACT_REGISTRY_PROJECT}/staging/firebase:$BUILD_ID"

timeout: 4200s # 70 minutes

options:
  requestedVerifyOption: VERIFIED
  volumes:
    - name: "ssh"
      path: /root/.ssh

substitutions:
  _VERSION: ""
  _BRANCH: ""
  _KEY_RING: "cloud-build-ring"
  _KEY_NAME: "publish"
  _REPOSITORY_ORG: "firebase"
  _REPOSITORY_NAME: "firebase-tools"
  _ARTIFACT_REGISTRY_PROJECT: "firebase-cli"
