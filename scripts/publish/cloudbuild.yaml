steps:
  # Decrypt the SSH key.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      [
        "gcloud",
        "kms",
        "decrypt",
        "--ciphertext-file=deploy_key.enc",
        "--plaintext-file=/root/.ssh/id_rsa",
        "--location=global",
        "--keyring=${_KEY_RING}",
        "--key=${_KEY_NAME}",
      ]

  # Decrypt the Twitter credentials.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      [
        "gcloud",
        "kms",
        "decrypt",
        "--ciphertext-file=twitter.json.enc",
        "--plaintext-file=twitter.json",
        "--location=global",
        "--keyring=${_KEY_RING}",
        "--key=${_KEY_NAME}",
      ]

  # Decrypt the npm credentials.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      [
        "gcloud",
        "kms",
        "decrypt",
        "--ciphertext-file=npmrc.enc",
        "--plaintext-file=npmrc",
        "--location=global",
        "--keyring=${_KEY_RING}",
        "--key=${_KEY_NAME}",
      ]

  # Decrypt the hub (GitHub) credentials.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      [
        "gcloud",
        "kms",
        "decrypt",
        "--ciphertext-file=hub.enc",
        "--plaintext-file=hub",
        "--location=global",
        "--keyring=${_KEY_RING}",
        "--key=${_KEY_NAME}",
      ]

  # Set up git with key and domain.
  - name: "gcr.io/cloud-builders/git"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        chmod 600 /root/.ssh/id_rsa
        cat <<EOF >/root/.ssh/config
        Hostname github.com
        IdentityFile /root/.ssh/id_rsa
        EOF
        ssh-keyscan github.com >> /root/.ssh/known_hosts

  # Clone the repository.
  - name: "gcr.io/cloud-builders/git"
    args: ["clone", "git@github.com:${_REPOSITORY_ORG}/${_REPOSITORY_NAME}"]

  # Set up the Git configuration.
  - name: "gcr.io/cloud-builders/git"
    dir: "${_REPOSITORY_NAME}"
    args: ["config", "--global", "user.email", "firebase-oss-bot@google.com"]
  - name: "gcr.io/cloud-builders/git"
    dir: "${_REPOSITORY_NAME}"
    args: ["config", "--global", "user.name", "Google Open Source Bot"]

  # Set up the Twitter credentials.
  - name: "gcr.io/$PROJECT_ID/package-builder"
    entrypoint: "cp"
    args: ["-v", "twitter.json", "${_REPOSITORY_NAME}/scripts/twitter.json"]

  # Set up the npm credentials.
  - name: "gcr.io/$PROJECT_ID/package-builder"
    entrypoint: "bash"
    args: ["-c", "cp -v npmrc ~/.npmrc"]

  # Set up the hub credentials for package-builder.
  - name: "gcr.io/$PROJECT_ID/package-builder"
    entrypoint: "bash"
    args: ["-c", "mkdir -vp ~/.config && cp -v hub ~/.config/hub"]

  # Publish the package.
  - name: "gcr.io/$PROJECT_ID/package-builder"
    dir: "${_REPOSITORY_NAME}"
    entrypoint: bash
    args:
      - -c
      - |
        if [ "${_VERSION}" == "preview" ]; then
          ./scripts/publish.sh "${_VERSION}" "${_BRANCH}"
        else
          GITHUB_TOKEN=$(cat ~/.config/hub) ./scripts/publish.sh "${_VERSION}"
        fi
    env:
      - "REPOSITORY_ORG=${_REPOSITORY_ORG}"
      - "REPOSITORY_NAME=${_REPOSITORY_NAME}"

  # Wait for package to be available on npm.
  - name: "gcr.io/$PROJECT_ID/package-builder"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "Waiting for firebase-tools@$(cat /workspace/version_number.txt) to be available on npm..."
        timeout=300
        elapsed=0
        interval=15
        until npm install --dry-run "firebase-tools@$(cat /workspace/version_number.txt)" > /dev/null 2>&1; do
          if [ $$elapsed -ge $$timeout ]; then
            echo "Timeout waiting for package."
            exit 1
          fi
          echo "Still waiting..."
          sleep $$interval
          elapsed=$$((elapsed + interval))
        done
        echo "Sleeping for 60 seconds to ensure propagation..." 
        sleep 60
        echo "Package firebase-tools@$(cat /workspace/version_number.txt) is now available on npm."

  # Set up the hub and npm credentials for firepit-builder.
  - name: "gcr.io/$PROJECT_ID/firepit-builder"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ "${_VERSION}" != "preview" ]; then
          mkdir -vp ~/.config && cp -v hub ~/.config/hub
          cp -v npmrc ~/.npmrc
        else
          echo "Skipping credentials for firepit-builder for preview."
        fi

  # Publish the firepit builds.
  - name: "gcr.io/$PROJECT_ID/firepit-builder"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ "${_VERSION}" != "preview" ]; then
          GITHUB_TOKEN=$(cat ~/.config/hub) node /usr/src/app/pipeline.js --package=firebase-tools@$(cat /workspace/version_number.txt) --publish
          echo "Please review the draft release notes at https://github.com/${_REPOSITORY_ORG}/${_REPOSITORY_NAME}/releases. If it looks good, publish it"
        else
          echo "Skipping firepit build for preview version."
        fi

  # Tag the previous version of the docker image
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ "${_VERSION}" != "preview" ]; then
          IMAGE_NAME="us-docker.pkg.dev/${_ARTIFACT_REGISTRY_PROJECT}/us/firebase"
          TAGS=$(gcloud container images list-tags $${IMAGE_NAME} --filter="tags:latest" --format="value(tags)")
          echo "Tags for latest: $${TAGS}"
          PREVIOUS_VERSION=$(echo $${TAGS} | tr ',' '\n' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$$' | head -n 1)
          echo "Detected previous version: $${PREVIOUS_VERSION}"
          if [ -n "$${PREVIOUS_VERSION}" ]; then
            gcloud container images add-tag $${IMAGE_NAME}:latest $${IMAGE_NAME}:no-new-use-public-image-$${PREVIOUS_VERSION} --quiet
          else
            echo "Could not detect previous version tag. Skipping tagging."
          fi
        else
          echo "Skipping for preview version."
        fi

  # Build and publish the Firebase docker image to staging
  - id: "docker-build-push-staging"
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ "${_VERSION}" != "preview" ]; then
          set -e
          VERSION_NUM="$$(cat /workspace/version_number.txt)"
          STAGING_REPO="us-docker.pkg.dev/${_ARTIFACT_REGISTRY_PROJECT}/staging/firebase"
          echo "Building Docker image for version $${VERSION_NUM}..."
          docker build \
            -t "$${STAGING_REPO}:$${VERSION_NUM}" \
            -t "$${STAGING_REPO}:latest" \
            -f ./firebase-docker-image/Dockerfile ./firebase-docker-image
          echo "Pushing Docker image to staging repository..."
          docker push "$${STAGING_REPO}:$${VERSION_NUM}"

          DIGEST="$$(docker inspect "$${STAGING_REPO}:$${VERSION_NUM}" --format='{{range .RepoDigests}}{{println .}}{{end}}' | grep "/staging/firebase@" | head -n 1 | cut -d'@' -f2)"
          if [ -z "$${DIGEST}" ]; then
            echo "Fallback: fetching digest via RepoDigests index 0..."
            DIGEST="$$(docker inspect --format='{{index .RepoDigests 0}}' "$${STAGING_REPO}:$${VERSION_NUM}" | cut -d'@' -f2)"
          fi
          echo "Staging image digest: $${DIGEST}"
          echo "$${DIGEST}" > /workspace/docker_digest.txt
        else
          echo "Skipping docker build for preview version."
        fi

  # Promote image to production through Artifact Registry Exit Gate
  - id: "promote-docker-image-to-prod"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    waitFor: ["docker-build-push-staging"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ "${_VERSION}" != "preview" ]; then
          set -e
          VERSION_NUM="$$(cat /workspace/version_number.txt)"
          DIGEST="$$(cat /workspace/docker_digest.txt)"
          if [ -z "$${DIGEST}" ]; then
            echo "Error: docker_digest.txt is empty or missing" >&2
            exit 1
          fi

          LOCATION="us"
          PROD_PROJECT="${_ARTIFACT_REGISTRY_PROJECT}"
          STAGING_REPO="staging"
          PROD_REPO="us"
          PACKAGE_NAME="firebase"

          echo "Promoting image $${PACKAGE_NAME}@$${DIGEST} from $${STAGING_REPO} to $${PROD_REPO} via Exit Gate..."
          ACCESS_TOKEN="$$(gcloud auth print-access-token)"

          PAYLOAD=$$(cat <<EOF
          {
            "source_repository": "projects/$${PROD_PROJECT}/locations/$${LOCATION}/repositories/$${STAGING_REPO}",
            "source_version": "projects/$${PROD_PROJECT}/locations/$${LOCATION}/repositories/$${STAGING_REPO}/packages/$${PACKAGE_NAME}/versions/$${DIGEST}",
            "attachment_behavior": "PUBLIC_BCID_VSA_ONLY"
          }
          EOF
          )

          RESP=$$(curl -s -S -f -X POST \
            -H "Authorization: Bearer $${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://artifactregistry.googleapis.com/v1/projects/$${PROD_PROJECT}/locations/$${LOCATION}/repositories/$${PROD_REPO}:promoteArtifact" \
            -d "$${PAYLOAD}")

          OP_NAME=$$(python3 -c "import sys, json; print(json.loads(sys.stdin.read()).get('name', ''))" <<< "$${RESP}")
          if [ -z "$${OP_NAME}" ]; then
            echo "Error: Failed to initiate promotion operation. Response: $${RESP}" >&2
            exit 1
          fi

          echo "Waiting for promotion operation $${OP_NAME} to complete..."
          IS_DONE="False"
          for i in $$(seq 1 60); do
            OP_STATUS=$$(curl -s -S -H "Authorization: Bearer $${ACCESS_TOKEN}" \
              "https://artifactregistry.googleapis.com/v1/$${OP_NAME}" || echo "")
            if [ -n "$${OP_STATUS}" ]; then
              PARSE_RESULT=$$(python3 -c "
        import sys, json
        try:
            data = json.loads(sys.stdin.read())
            if data.get('done', False):
                error = data.get('error')
                if error:
                    print('ERROR:' + error.get('message', 'Unknown error'))
                else:
                    print('DONE')
            else:
                print('PENDING')
        except Exception:
            print('PENDING')
        " <<< "$${OP_STATUS}")
              if [ "$${PARSE_RESULT}" = "DONE" ]; then
                IS_DONE="True"
                echo "Artifact promotion completed successfully!"
                break
              elif [[ "$${PARSE_RESULT}" == ERROR:* ]]; then
                echo "Error: Artifact promotion failed: $${PARSE_RESULT#ERROR:}" >&2
                exit 1
              fi
            fi
            sleep 5
          done

          if [ "$${IS_DONE}" != "True" ]; then
            echo "Error: Timed out waiting for artifact promotion operation." >&2
            exit 1
          fi

          echo "Adding production tags to promoted image in $${PROD_REPO}..."
          gcloud artifacts docker tags add \
            "us-docker.pkg.dev/$${PROD_PROJECT}/$${PROD_REPO}/$${PACKAGE_NAME}@$${DIGEST}" \
            "us-docker.pkg.dev/$${PROD_PROJECT}/$${PROD_REPO}/$${PACKAGE_NAME}:$${VERSION_NUM}"
          gcloud artifacts docker tags add \
            "us-docker.pkg.dev/$${PROD_PROJECT}/$${PROD_REPO}/$${PACKAGE_NAME}@$${DIGEST}" \
            "us-docker.pkg.dev/$${PROD_PROJECT}/$${PROD_REPO}/$${PACKAGE_NAME}:latest"
          echo "Production tags added successfully."
        else
          echo "Skipping docker promotion for preview version."
        fi

timeout: 2400s # 40 minutes

options:
  volumes:
    - name: "ssh"
      path: /root/.ssh

substitutions:
  _VERSION: ""
  _BRANCH: ""
  _KEY_RING: "cloud-build-ring"
  _KEY_NAME: "publish"
  _REPOSITORY_ORG: "firebase"
  _REPOSITORY_NAME: "firebase-tools"
  _ARTIFACT_REGISTRY_PROJECT: "firebase-cli"
