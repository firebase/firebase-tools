version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week before proposing a newly published version so that
    # compromised or broken releases have time to be caught and yanked.
    # Cooldown does not delay security updates.
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # Bundle all security fixes for the root package into a single PR so that
      # transitive fixes don't pile up as many individual PRs.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      patch:
        update-types:
          - "patch"
      minor:
        update-types:
          - "minor"
